<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chai With Code</title>
</head>
<body style="background-Color:#212121; color: white;">
    <ul class="language">
        <li>Javascript</li>
    </ul>
    
</body>
<script>
    function addLanguage(langName){
        const li = document.createElement('li');
        li.innerHTML = `${langName}`
        document.querySelector('.language').appendChild(li)
    }
    addLanguage("Python")
    addLanguage("TypeScript")

    function addOptiLangauge(langname){
        const li = document.createElement('li')
        li.appendChild(document.createTextNode(langname))
        document.querySelector('.language').appendChild(li)
    }
    addOptiLangauge("Java")

    // Edit
    const secondlang = document.querySelector("li:nth-child(2)")
    secondlang.innerHTML = "Mojo" // not optimize way

    const newli = document.createElement('li')
    newli.textContent = "Mojo"
    secondlang.replaceWith(newli);
    
    const firstlang = document.querySelector("li:first-child")
    firstlang.outerHTML = '<li>Script</li>'

    //remove
    const lastLang = document.querySelector('li:last-child')
    lastLang.remove()


    const newli1 = document.createElement('li')
    newli1.appendChild(document.createTextNode("Java"))
    document.querySelector('.language').appendChild(newli1)

</script>
</html>
